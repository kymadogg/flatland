[project]
name = "flatland"
version = "0.1.0"
description = "A 2D grid world simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "matplotlib>=3.11.1",
    "maturin>=1.15.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3" 
python-source = "." 